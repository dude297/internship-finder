name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    # Documentation guard (docs/README.md "Enforcement"): stdlib-only script, no secrets, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the changed-path guards diff against the base
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: backend/.python-version
      - name: Checker tests
        run: python -m unittest discover -s scripts/tests
      - name: Repository checks
        run: python scripts/check_docs.py
      - name: Changed-path guards
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            echo "No base to diff against; skipping changed-path guards."; exit 0
          fi
          python scripts/check_docs.py --base "$base"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Disposable database that exists only for this job. Test-only credentials, not secrets.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: internship_finder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d internship_finder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci-test-only@localhost:5432/internship_finder_test
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-test-only@localhost:5432/internship_finder_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: backend/.python-version
      # Locked, hash-checked dependencies, then the app itself without re-resolving: a
      # dependency missing from the lock fails here or at import, loudly (docs/development.md).
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.lock && .venv/bin/python -m pip install --no-deps -e .
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pyright
      - name: Unit tests
        run: .venv/bin/pytest -m "not postgres"
      - name: Migration round trip (PostgreSQL)
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
      - name: PostgreSQL integration and migration tests
        run: .venv/bin/pytest -m postgres

  e2e:
    runs-on: ubuntu-latest
    # Disposable database that exists only for this job. Test-only credentials, not secrets.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: internship_finder_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d internship_finder_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://ci:ci-test-only@localhost:5432/internship_finder_e2e
      # Synthetic, test-only owner for the disposable database above. Not a secret.
      E2E_OWNER_USERNAME: e2e-synthetic-owner
      E2E_OWNER_PASSWORD: e2e-synthetic-password-not-a-secret
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: backend/.python-version
      - name: Install backend
        working-directory: backend
        run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock && .venv/bin/python -m pip install --no-deps -e .
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (migrates the database and bootstraps the synthetic owner)
        working-directory: frontend
        run: npx playwright test
      # Only synthetic test data can appear in these (the database and owner above are fake).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
