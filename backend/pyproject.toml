[project]
name = "internship-finder-backend"
version = "0.0.0"
description = "FastAPI backend for the Personal Internship Finder"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",
    "ruff>=0.16,<0.17",
    "pyright>=1.1.414,<1.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrations embed long SQL CHECK expressions verbatim.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the alembic package as first-party.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pyright]
include = ["app", "tests", "alembic"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["postgres: needs a disposable PostgreSQL database (TEST_DATABASE_URL)"]
